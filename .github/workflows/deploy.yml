name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      # A failing check stops the deploy.
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      # The runner image ships PostgreSQL; its server binaries aren't on PATH.
      - name: Put the Postgres binaries on PATH
        run: echo "$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_PATH"
      - run: yarn test:sql
      - run: yarn check:schema
      - run: yarn build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUITE_WORK_URL: ${{ vars.VITE_SUITE_WORK_URL }}
          VITE_SUITE_SUPPORT_URL: ${{ vars.VITE_SUITE_SUPPORT_URL }}
          VITE_SUITE_PEOPLE_URL: ${{ vars.VITE_SUITE_PEOPLE_URL }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
